# Einmaliger Helfer: lädt die mit Higgsfield erzeugten Bilder, optimiert sie
# fürs Web und committet sie nach img/. Kann danach gelöscht werden.
name: Bilder laden (einmalig)

on:
  push:
    branches: [main]
    paths: [".github/workflows/bilder-laden.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  laden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pillow

      - name: Bilder herunterladen und optimieren
        run: |
          python - <<'PY'
          import io, urllib.request
          from PIL import Image

          base = "https://d8j0ntlcm91z4.cloudfront.net/user_3IJncNsUEqP06Q3B4XEZjdZrN1b/"
          files = {
              "wieds-produktion":       "hf_20261022_091750_6f980f75-1ddc-4538-aa0d-adbcb11a89c2",
              "wieds-cnc":              "hf_20261022_091751_b8417574-35c0-4773-8de1-5a29510dbeab",
              "wieds-kuehlkreislauf":   "hf_20261022_091751_ec9a5b70-b638-404c-83fd-f4f7c3969e22",
              "wieds-hygiene":          "hf_20261022_091750_915db5c8-8982-4853-9d3b-5e3a044ec63d",
              "grander-zuhause":        "hf_20261022_091751_0222a620-6a83-4338-b9d8-5aaca85d8db7",
              "grander-gastro":         "hf_20261022_091751_7cc19bbf-7e07-4b6d-baef-5f89de55e1da",
              "grander-betriebe":       "hf_20261022_091752_9c876dad-e994-408d-8b41-6f8636d0c421",
              "grander-landwirtschaft": "hf_20261022_091752_a6b61dd8-a498-460f-b7dc-a82fe00f7f20",
              "grander-quelle":         "hf_20261022_091750_99a55abc-3c73-4fd1-b8bf-b09cb8cdedfa",
          }
          for name, key in files.items():
              req = urllib.request.Request(base + key + ".png", headers={"User-Agent": "Mozilla/5.0"})
              data = urllib.request.urlopen(req, timeout=180).read()
              im = Image.open(io.BytesIO(data)).convert("RGB")
              im.thumbnail((1600, 1200), Image.LANCZOS)
              im.save(f"img/{name}.jpg", quality=80, optimize=True, progressive=True)
              print(name, im.size)
          PY

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/
          git commit -m "Higgsfield-Bilder ins Repo geladen" || echo "Keine Änderungen"
          git push
