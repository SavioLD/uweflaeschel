# Temporär: prüft DNS, HTTPS und Inhalt von uwe-flaeschel.com. Branch kann gelöscht werden.
name: Live-Check uwe-flaeschel.com
on:
  push:
    branches: [dns-check]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: DNS, HTTPS, Inhalt
        run: |
          D=uwe-flaeschel.com
          echo "=== A $D ==="; dig +short A $D
          echo "=== www.$D ==="; dig +short www.$D
          echo "=== MX ==="; dig +short MX $D
          for u in http://$D https://$D https://www.$D https://$D/granderwasser.html https://$D/img/wieds-cnc.jpg https://$D/gibtsnicht; do
            printf '%-45s ' "$u"; curl -s -o /dev/null -m 20 -w '%{http_code} -> %{redirect_url}\n' "$u" || echo "FEHLER"
          done
          echo "=== Titel Startseite ==="; curl -sL -m 20 https://$D | grep -o '<title>[^<]*' || echo "kein Titel / HTTPS-Fehler"
          echo "=== Titel Grander ==="; curl -sL -m 20 https://$D/granderwasser.html | grep -o '<title>[^<]*' || true
          echo "=== Zertifikat ==="; echo | openssl s_client -connect $D:443 -servername $D 2>/dev/null | openssl x509 -noout -subject -issuer -enddate 2>/dev/null || echo "kein Zertifikat"
          echo "=== uwe-flaeschel.de (alt) ==="; dig +short A uwe-flaeschel.de; curl -sL -m 20 https://uwe-flaeschel.de | grep -o '<title>[^<]*' || true
